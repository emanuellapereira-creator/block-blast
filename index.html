<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Block Blast - Quebra-Cabeça de Blocos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Configurações Base e Prevenção de Scroll/Seleção */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: radial-gradient(circle at 50% 0%, #241b4b 0%, #120d29 55%, #090617 100%);
            color: #ffffff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Estilização do Tabuleiro 8x8 */
        .board-wrapper {
            background: linear-gradient(145deg, #1b153b, #110c26);
            border: 3px solid rgba(139, 92, 246, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), inset 0 2px 10px rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 10px;
            position: relative;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            width: 100%;
            height: 100%;
        }

        .cell {
            background-color: rgba(15, 11, 36, 0.85);
            border-radius: 7px;
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.04);
            position: relative;
            transition: transform 0.12s ease, background-color 0.15s ease;
        }

        /* Blocos Preenchidos com Efeito 3D Brilhante */
        .block-3d {
            border-radius: 7px;
            position: relative;
            box-shadow:
                inset 0 3px 4px rgba(255, 255, 255, 0.55),
                inset 0 -3px 5px rgba(0, 0, 0, 0.35),
                0 3px 6px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        /* Brilho interno superior */
        .block-3d::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 3px;
            right: 3px;
            height: 35%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 100%);
            border-radius: 4px;
            pointer-events: none;
        }

        /* Pré-visualização (Ghost Preview) no tabuleiro */
        .cell.ghost {
            opacity: 0.55;
            transform: scale(0.95);
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.6);
        }

        /* Destaque para linhas/colunas prestes a serem completadas */
        .cell.will-clear {
            animation: pulseClear 0.55s infinite alternate;
            z-index: 2;
        }

        @keyframes pulseClear {
            0% {
                filter: brightness(1.15);
                transform: scale(0.97);
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
            }

            100% {
                filter: brightness(1.55);
                transform: scale(1.03);
                box-shadow: 0 0 18px rgba(255, 255, 255, 0.95);
            }
        }

        /* Animação de limpeza de bloco */
        .cell.clearing {
            animation: popClear 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popClear {
            0% {
                transform: scale(1);
                filter: brightness(2);
            }

            50% {
                transform: scale(1.25);
                opacity: 0.9;
            }

            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        /* Área das Peças Inferiores */
        .dock-slot {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            transition: background 0.2s;
        }

        .piece-container {
            display: grid;
            gap: 3px;
            cursor: grab;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s;
            padding: 8px;
        }

        .piece-container:active {
            cursor: grabbing;
        }

        .piece-container.disabled {
            opacity: 0.35;
            filter: grayscale(0.6);
        }

        /* Peça flutuante durante o arraste */
        #drag-layer {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1000;
            display: none;
            transform-origin: center center;
            filter: drop-shadow(0 18px 25px rgba(0, 0, 0, 0.65));
        }

        /* Textos flutuantes de Combo / Pontuação */
        .floating-text {
            position: fixed;
            pointer-events: none;
            font-weight: 700;
            text-align: center;
            z-index: 900;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
            animation: floatUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translate(-50%, 10px) scale(0.5);
            }

            20% {
                opacity: 1;
                transform: translate(-50%, -15px) scale(1.15);
            }

            80% {
                opacity: 1;
                transform: translate(-50%, -45px) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -65px) scale(0.9);
            }
        }

        /* Canvas de Partículas */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 800;
        }

        /* Animação do Modal */
        .modal-backdrop {
            backdrop-filter: blur(8px);
            background: rgba(9, 6, 23, 0.78);
            animation: fadeIn 0.3s ease forwards;
        }

        .modal-card {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Tremor suave na tela ao fazer combo grande */
        .shake {
            animation: screenShake 0.35s ease-in-out;
        }

        @keyframes screenShake {

            0%,
            100% {
                transform: translate(0, 0);
            }

            20% {
                transform: translate(-5px, 4px);
            }

            40% {
                transform: translate(5px, -4px);
            }

            60% {
                transform: translate(-4px, -3px);
            }

            80% {
                transform: translate(4px, 3px);
            }
        }
    </style>
</head>

<body class="px-3 py-3 sm:py-5">

    <!-- Canvas para explosões de partículas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Cabeçalho: Recorde, Título e Controles -->
    <header class="w-full max-w-md flex items-center justify-between px-2 pt-1">

        <!-- Indicador de Combo Ativo -->

        <!-- Botões de Ação (Som e Reiniciar) -->
        <div class="flex items-center gap-2">
            <button id="btn-sound" aria-label="Alternar Som"

            <button id="btn-restart" aria-label="Reiniciar Jogo"

                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Placar Central -->
    <section class="flex flex-col items-center justify-center my-1">
        <span class="text-xs uppercase tracking-widest text-indigo-300/70 font-semibold">Pontuação</span>
        <div id="current-score"
            class="text-4xl sm:text-5xl font-bold bg-gradient-to-b from-white to-indigo-200 bg-clip-text text-transparent drop-shadow-sm">
            0
        </div>
    </section>

    <!-- Tabuleiro Principal 8x8 -->
    <main id="game-container" class="flex items-center justify-center w-full flex-1 max-h-[56vh] sm:max-h-[58vh]">
        <div id="board-wrapper" class="board-wrapper aspect-square h-full max-w-[92vw] max-h-full">
            <div id="board-grid" class="board-grid"></div>
        </div>
    </main>

    <!-- Área Inferior com as 3 Peças Disponíveis -->
    <footer class="w-full max-w-md h-28 sm:h-32 flex items-center justify-between gap-2.5 px-1 pb-2">
        <div id="slot-0" class="dock-slot"></div>
        <div id="slot-1" class="dock-slot"></div>
        <div id="slot-2" class="dock-slot"></div>
    </footer>

    <!-- Camada Flutuante para Peça Sendo Arrastada -->
    <div id="drag-layer"></div>

    <!-- Modal de Fim de Jogo (Game Over) -->
    <div id="gameover-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-backdrop">
        <div
            class="modal-card w-full max-w-sm bg-gradient-to-b from-[#23194d] to-[#130d2e] border-2 border-purple-400/30 rounded-3xl p-6 text-center shadow-2xl">
            <div
                class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-rose-500/20 border border-rose-400/30 text-rose-400 mb-3">
                <svg class="w-9 h-9" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>

            <h2 class="text-3xl font-bold text-white mb-1">Fim de Jogo!</h2>
            <p class="text-sm text-indigo-200/75 mb-5">Sem espaço para mais movimentos.</p>

            <div class="bg-black/30 rounded-2xl p-4 mb-6 border border-white/5 space-y-3">

                </div>
                <div class="h-px bg-white/10"></div>

                        class="inline-block bg-gradient-to-r from-amber-500 to-orange-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow">
                        🎉 NOVO RECORDE!
                    </span>
                </div>
            </div>

            <button id="btn-play-again"
                class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 active:scale-95 text-white font-bold text-lg shadow-lg shadow-emerald-500/30 transition transform">
                Jogar Novamente
            </button>
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * 1. SISTEMA DE ÁUDIO SINTETIZADO (WEB AUDIO API)
         * ============================================================================
         */
        class SoundManager {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            toggleMute() {
                this.muted = !this.muted;
                return this.muted;
            }

            playTone(freq, type, duration, vol = 0.15, slideFreq = null) {
                if (this.muted) return;
                this.init();
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    if (slideFreq) {
                        osc.frequency.exponentialRampToValueAtTime(slideFreq, this.ctx.currentTime + duration);
                    }
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {
                    // Ignora erros de áudio caso o navegador bloqueie antes da interação
                }
            }

            playPickup() {
                this.playTone(320, 'sine', 0.08, 0.12, 480);
            }

            playDrop() {
                this.playTone(220, 'triangle', 0.12, 0.18, 110);
            }

            playInvalid() {
                this.playTone(150, 'sawtooth', 0.14, 0.08, 100);
            }

            playClear(combo = 1) {
                if (this.muted) return;
                this.init();
                const baseNotes = [523.25, 659.25, 783.99, 1046.50]; // Dó, Mi, Sol, Dó agudo
                const pitchMultiplier = Math.min(1 + (combo - 1) * 0.12, 1.6);

                baseNotes.forEach((freq, idx) => {
                    setTimeout(() => {
                        this.playTone(freq * pitchMultiplier, 'sine', 0.28, 0.16, freq * pitchMultiplier * 1.15);
                    }, idx * 55);
                });
            }

            playGameOver() {
                if (this.muted) return;
                const notes = [392.00, 349.23, 329.63, 261.63];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        this.playTone(freq, 'triangle', 0.35, 0.15, freq * 0.9);
                    }, idx * 140);
                });
            }
        }

        const sound = new SoundManager();

        /**
         * ============================================================================
         * 2. PALETA DE CORES VIBRANTES E DEFINIÇÃO DAS PEÇAS
         * ============================================================================
         */
        const BLOCK_COLORS = [
            { id: 'cyan', bg: 'linear-gradient(135deg, #22d3ee, #0284c7)', hex: '#22d3ee' },
            { id: 'amber', bg: 'linear-gradient(135deg, #fbbf24, #d97706)', hex: '#fbbf24' },
            { id: 'emerald', bg: 'linear-gradient(135deg, #34d399, #059669)', hex: '#34d399' },
            { id: 'rose', bg: 'linear-gradient(135deg, #fb7185, #e11d48)', hex: '#fb7185' },
            { id: 'violet', bg: 'linear-gradient(135deg, #a78bfa, #7c3aed)', hex: '#a78bfa' },
            { id: 'orange', bg: 'linear-gradient(135deg, #fb923c, #ea580c)', hex: '#fb923c' },
            { id: 'blue', bg: 'linear-gradient(135deg, #60a5fa, #2563eb)', hex: '#60a5fa' },
            { id: 'pink', bg: 'linear-gradient(135deg, #f472b6, #db2777)', hex: '#f472b6' }
        ];

        // Formatos variados no estilo Block Blast (1x1 até 3x3, linhas, Ls, Ts, Zs)
        const PIECE_SHAPES = [
            // Ponto 1x1
            { matrix: [[1]], weight: 4 },
            // Dominós (2 blocos)
            { matrix: [[1, 1]], weight: 7 },
            { matrix: [[1], [1]], weight: 7 },
            // Triminós (3 blocos)
            { matrix: [[1, 1, 1]], weight: 8 },
            { matrix: [[1], [1], [1]], weight: 8 },
            { matrix: [[1, 1], [1, 0]], weight: 7 },
            { matrix: [[1, 1], [0, 1]], weight: 7 },
            { matrix: [[1, 0], [1, 1]], weight: 7 },
            { matrix: [[0, 1], [1, 1]], weight: 7 },
            // Quadrado 2x2
            { matrix: [[1, 1], [1, 1]], weight: 10 },
            // Linhas de 4
            { matrix: [[1, 1, 1, 1]], weight: 6 },
            { matrix: [[1], [1], [1], [1]], weight: 6 },
            // Linhas de 5
            { matrix: [[1, 1, 1, 1, 1]], weight: 4 },
            { matrix: [[1], [1], [1], [1], [1]], weight: 4 },
            // Tetrominós em T
            { matrix: [[1, 1, 1], [0, 1, 0]], weight: 6 },
            { matrix: [[0, 1, 0], [1, 1, 1]], weight: 6 },
            { matrix: [[1, 0], [1, 1], [1, 0]], weight: 6 },
            { matrix: [[0, 1], [1, 1], [0, 1]], weight: 6 },
            // Tetrominós em L
            { matrix: [[1, 0], [1, 0], [1, 1]], weight: 6 },
            { matrix: [[0, 1], [0, 1], [1, 1]], weight: 6 },
            { matrix: [[1, 1, 1], [1, 0, 0]], weight: 6 },
            { matrix: [[1, 1, 1], [0, 0, 1]], weight: 6 },
            // Tetrominós em Z / S
            { matrix: [[1, 1, 0], [0, 1, 1]], weight: 5 },
            { matrix: [[0, 1, 1], [1, 1, 0]], weight: 5 },
            { matrix: [[1, 0], [1, 1], [0, 1]], weight: 5 },
            { matrix: [[0, 1], [1, 1], [1, 0]], weight: 5 },
            // L Grande 3x3
            { matrix: [[1, 0, 0], [1, 0, 0], [1, 1, 1]], weight: 4 },
            { matrix: [[0, 0, 1], [0, 0, 1], [1, 1, 1]], weight: 4 },
            { matrix: [[1, 1, 1], [1, 0, 0], [1, 0, 0]], weight: 4 },
            { matrix: [[1, 1, 1], [0, 0, 1], [0, 0, 1]], weight: 4 },
            // Retângulo 2x3 e 3x2
            { matrix: [[1, 1, 1], [1, 1, 1]], weight: 4 },
            { matrix: [[1, 1], [1, 1], [1, 1]], weight: 4 },
            // Quadrado 3x3
            { matrix: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], weight: 3 }
        ];

        /**
         * ============================================================================
         * 3. ESTADO GLOBAL DO JOGO E ELEMENTOS DOM
         * ============================================================================
         */
        const BOARD_SIZE = 8;
        let board = []; // Matriz 8x8 contendo null ou objeto de cor
        let trayPieces = [null, null, null]; // 3 peças inferiores
        let score = 0;
        let highScore = parseInt(localStorage.getItem('blockBlastHighScore') || '0', 10);
        let comboStreak = 0; // Contador de jogadas consecutivas limpando linhas
        let isGameOver = false;

        // Estado de Drag & Drop
        let dragState = {
            active: false,
            slotIndex: -1,
            piece: null,
            isTouch: false,
            pointerId: null,
            hoverRow: -1,
            hoverCol: -1,
            isValid: false,
            cellSize: 40
        };

        // Referências DOM
        const boardGridEl = document.getElementById('board-grid');
        const boardWrapperEl = document.getElementById('board-wrapper');
        const dragLayerEl = document.getElementById('drag-layer');
        const scoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');
        const comboBadgeEl = document.getElementById('combo-badge');
        const gameOverModalEl = document.getElementById('gameover-modal');
        const slotEls = [
            document.getElementById('slot-0'),
            document.getElementById('slot-1'),
            document.getElementById('slot-2')
        ];

        let cellElements = []; // Matriz 8x8 de elementos DOM das células

        /**
         * ============================================================================
         * 4. SISTEMA DE PARTÍCULAS E TEXTOS FLUTUANTES
         * ============================================================================
         */
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function spawnParticles(x, y, colorHex, count = 12) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
                const speed = 2.5 + Math.random() * 5.5;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1.5,
                    size: 4 + Math.random() * 5,
                    color: colorHex,
                    alpha: 1,
                    gravity: 0.22,
                    rotation: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.2
                });
            }
        }

        function updateAndDrawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.alpha -= 0.025;
                p.rotation += p.vRot;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rotation);
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
            }
            requestAnimationFrame(updateAndDrawParticles);
        }
        requestAnimationFrame(updateAndDrawParticles);

        function showFloatingText(text, x, y, colorClass = 'text-amber-300', sizeClass = 'text-2xl sm:text-3xl') {
            const el = document.createElement('div');
            el.className = `floating-text ${colorClass} ${sizeClass}`;
            el.textContent = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1150);
        }

        /**
         * ============================================================================
         * 5. LÓGICA PRINCIPAL DO TABULEIRO E PEÇAS
         * ============================================================================
         */
        function initBoard() {
            boardGridEl.innerHTML = '';
            board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));
            cellElements = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    boardGridEl.appendChild(cell);
                    cellElements[r][c] = cell;
                }
            }
        }

        function getRandomPiece() {
            const totalWeight = PIECE_SHAPES.reduce((acc, p) => acc + p.weight, 0);
            let random = Math.random() * totalWeight;
            let selectedShape = PIECE_SHAPES[0].matrix;

            for (const item of PIECE_SHAPES) {
                if (random < item.weight) {
                    selectedShape = item.matrix;
                    break;
                }
                random -= item.weight;
            }

            const color = BLOCK_COLORS[Math.floor(Math.random() * BLOCK_COLORS.length)];
            return {
                matrix: selectedShape,
                color: color,
                rows: selectedShape.length,
                cols: selectedShape[0].length
            };
        }

        function generateTrayPieces() {
            for (let i = 0; i < 3; i++) {
                trayPieces[i] = getRandomPiece();
            }
            renderTray();
        }

        function renderTray() {
            for (let i = 0; i < 3; i++) {
                const slot = slotEls[i];
                slot.innerHTML = '';
                const piece = trayPieces[i];
                if (!piece) continue;

                const container = document.createElement('div');
                container.className = 'piece-container';
                container.style.gridTemplateColumns = `repeat(${piece.cols}, 1fr)`;

                // Verifica se a peça cabe em algum lugar do tabuleiro
                const fits = canPieceFitAnywhere(piece);
                if (!fits) {
                    container.classList.add('disabled');
                }

                // Tamanho responsivo dos mini-blocos na bandeja inferior
                const miniSize = window.innerWidth < 400 ? 17 : 21;

                for (let r = 0; r < piece.rows; r++) {
                    for (let c = 0; c < piece.cols; c++) {
                        const block = document.createElement('div');
                        block.style.width = `${miniSize}px`;
                        block.style.height = `${miniSize}px`;

                        if (piece.matrix[r][c] === 1) {
                            block.className = 'block-3d';
                            block.style.background = piece.color.bg;
                            block.style.borderRadius = '5px';
                        } else {
                            block.style.opacity = '0';
                        }
                        container.appendChild(block);
                    }
                }

                // Eventos de início de arraste (Pointer Events unifica mouse e touch)
                slot.onpointerdown = (e) => startDrag(e, i);
                slot.appendChild(container);
            }
        }

        function renderBoard() {
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = cellElements[r][c];
                    const color = board[r][c];

                    // Limpa classes temporárias de preview
                    cell.classList.remove('ghost', 'will-clear');

                    if (color) {
                        cell.classList.add('block-3d');
                        cell.style.background = color.bg;
                    } else {
                        cell.classList.remove('block-3d');
                        cell.style.background = '';
                    }
                }
            }
        }

        /**
         * ============================================================================
         * 6. MECÂNICA DE ARRASTAR E SOLTAR (DRAG & DROP) + PRÉ-VISUALIZAÇÃO
         * ============================================================================
         */
        function getBoardCellSize() {
            const rect = cellElements[0][0].getBoundingClientRect();
            return rect.width;
        }

        function startDrag(e, slotIndex) {
            if (isGameOver || !trayPieces[slotIndex] || dragState.active) return;

            e.preventDefault();
            sound.init();
            sound.playPickup();

            const piece = trayPieces[slotIndex];
            const cellSize = getBoardCellSize();
            const isTouch = e.pointerType === 'touch';

            dragState = {
                active: true,
                slotIndex,
                piece,
                isTouch,
                pointerId: e.pointerId,
                hoverRow: -1,
                hoverCol: -1,
                isValid: false,
                cellSize
            };

            // Esconde visualmente a peça na bandeja enquanto arrasta
            const slotPieceEl = slotEls[slotIndex].querySelector('.piece-container');
            if (slotPieceEl) slotPieceEl.style.opacity = '0.15';

            // Constrói a peça em tamanho real na camada flutuante
            dragLayerEl.innerHTML = '';
            dragLayerEl.style.display = 'grid';
            dragLayerEl.style.gridTemplateColumns = `repeat(${piece.cols}, ${cellSize}px)`;
            dragLayerEl.style.gap = '4px';

            for (let r = 0; r < piece.rows; r++) {
                for (let c = 0; c < piece.cols; c++) {
                    const block = document.createElement('div');
                    block.style.width = `${cellSize}px`;
                    block.style.height = `${cellSize}px`;
                    if (piece.matrix[r][c] === 1) {
                        block.className = 'block-3d';
                        block.style.background = piece.color.bg;
                    }
                    dragLayerEl.appendChild(block);
                }
            }

            updateDragPosition(e.clientX, e.clientY);
        }

        function updateDragPosition(clientX, clientY) {
            if (!dragState.active) return;

            const { piece, cellSize, isTouch } = dragState;
            const gap = 4;
            const pieceWidth = piece.cols * cellSize + (piece.cols - 1) * gap;
            const pieceHeight = piece.rows * cellSize + (piece.rows - 1) * gap;

            // Deslocamento para cima no celular para o dedo não cobrir a peça
            const touchOffsetY = isTouch ? Math.max(85, pieceHeight * 0.75) : 15;

            const left = clientX - pieceWidth / 2;
            const top = clientY - pieceHeight / 2 - touchOffsetY;

            dragLayerEl.style.transform = `translate3d(${left}px, ${top}px, 0) scale(1.04)`;

            // Calcula qual célula do tabuleiro corresponde ao canto superior esquerdo da peça
            const boardRect = boardGridEl.getBoundingClientRect();
            const step = cellSize + gap;

            const relX = left - boardRect.left;
            const relY = top - boardRect.top;

            const targetCol = Math.round(relX / step);
            const targetRow = Math.round(relY / step);

            if (targetRow !== dragState.hoverRow || targetCol !== dragState.hoverCol) {
                dragState.hoverRow = targetRow;
                dragState.hoverCol = targetCol;
                updatePreview();
            }
        }

        function canPlacePiece(piece, startRow, startCol) {
            for (let r = 0; r < piece.rows; r++) {
                for (let c = 0; c < piece.cols; c++) {
                    if (piece.matrix[r][c] === 1) {
                        const boardR = startRow + r;
                        const boardC = startCol + c;
                        if (
                            boardR < 0 ||
                            boardR >= BOARD_SIZE ||
                            boardC < 0 ||
                            boardC >= BOARD_SIZE ||
                            board[boardR][boardC] !== null
                        ) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function updatePreview() {
            // Restaura aparência normal do tabuleiro antes de desenhar o novo preview
            renderBoard();

            const { piece, hoverRow, hoverCol } = dragState;
            if (!canPlacePiece(piece, hoverRow, hoverCol)) {
                dragState.isValid = false;
                return;
            }

            dragState.isValid = true;

            // Simula colocação para verificar quais linhas/colunas completariam
            const tempBoard = board.map(row => [...row]);
            for (let r = 0; r < piece.rows; r++) {
                for (let c = 0; c < piece.cols; c++) {
                    if (piece.matrix[r][c] === 1) {
                        tempBoard[hoverRow + r][hoverCol + c] = piece.color;
                        const cell = cellElements[hoverRow + r][hoverCol + c];
                        cell.classList.add('block-3d', 'ghost');
                        cell.style.background = piece.color.bg;
                    }
                }
            }

            // Detecta linhas e colunas completas na simulação
            const rowsToClear = [];
            const colsToClear = [];

            for (let r = 0; r < BOARD_SIZE; r++) {
                if (tempBoard[r].every(cell => cell !== null)) rowsToClear.push(r);
            }
            for (let c = 0; c < BOARD_SIZE; c++) {
                let full = true;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (tempBoard[r][c] === null) {
                        full = false;
                        break;
                    }
                }
                if (full) colsToClear.push(c);
            }

            // Destaca visualmente as linhas e colunas que serão limpas
            rowsToClear.forEach(r => {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    cellElements[r][c].classList.add('will-clear');
                }
            });
            colsToClear.forEach(c => {
                for (let r = 0; r < BOARD_SIZE; r++) {
                    cellElements[r][c].classList.add('will-clear');
                }
            });
        }

        function endDrag(e) {
            if (!dragState.active) return;

            const { slotIndex, piece, hoverRow, hoverCol, isValid } = dragState;

            dragLayerEl.style.display = 'none';
            dragState.active = false;

            if (isValid) {
                placePieceOnBoard(piece, hoverRow, hoverCol, slotIndex);
            } else {
                sound.playInvalid();
                renderBoard();
                const slotPieceEl = slotEls[slotIndex].querySelector('.piece-container');
                if (slotPieceEl) slotPieceEl.style.opacity = '1';
            }
        }

        // Listeners globais para movimento e soltura
        window.addEventListener('pointermove', (e) => {
            if (dragState.active && e.pointerId === dragState.pointerId) {
                updateDragPosition(e.clientX, e.clientY);
            }
        });

        window.addEventListener('pointerup', (e) => {
            if (dragState.active && e.pointerId === dragState.pointerId) {
                endDrag(e);
            }
        });

        window.addEventListener('pointercancel', (e) => {
            if (dragState.active && e.pointerId === dragState.pointerId) {
                dragState.isValid = false;
                endDrag(e);
            }
        });

        /**
         * ============================================================================
         * 7. COLOCAÇÃO DE PEÇA, LIMPEZA DE LINHAS, COMBOS E PONTUAÇÃO
         * ============================================================================
         */
        function placePieceOnBoard(piece, startRow, startCol, slotIndex) {
            let blocksPlaced = 0;

            for (let r = 0; r < piece.rows; r++) {
                for (let c = 0; c < piece.cols; c++) {
                    if (piece.matrix[r][c] === 1) {
                        board[startRow + r][startCol + c] = piece.color;
                        blocksPlaced++;
                    }
                }
            }

            // Remove a peça da bandeja
            trayPieces[slotIndex] = null;
            sound.playDrop();
            renderBoard();

            // Adiciona pontos pelos blocos colocados
            addScore(blocksPlaced * 10);

            // Verifica linhas e colunas completas
            checkAndClearLines(startRow, startCol);
        }

        function checkAndClearLines(lastRow, lastCol) {
            const rowsToClear = [];
            const colsToClear = [];

            for (let r = 0; r < BOARD_SIZE; r++) {
                if (board[r].every(cell => cell !== null)) {
                    rowsToClear.push(r);
                }
            }

            for (let c = 0; c < BOARD_SIZE; c++) {
                let full = true;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (board[r][c] === null) {
                        full = false;
                        break;
                    }
                }
                if (full) {
                    colsToClear.push(c);
                }
            }

            const totalLines = rowsToClear.length + colsToClear.length;

            if (totalLines > 0) {
                comboStreak++;
                sound.playClear(comboStreak);

                // Coleta todas as coordenadas únicas a serem limpas
                const cellsToClear = new Map();
                rowsToClear.forEach(r => {
                    for (let c = 0; c < BOARD_SIZE; c++) cellsToClear.set(`${r},${c}`, { r, c });
                });
                colsToClear.forEach(c => {
                    for (let r = 0; r < BOARD_SIZE; r++) cellsToClear.set(`${r},${c}`, { r, c });
                });

                // Animação e explosão de partículas em cada célula limpa
                let avgX = 0, avgY = 0, count = 0;
                cellsToClear.forEach(({ r, c }) => {
                    const cellEl = cellElements[r][c];
                    const rect = cellEl.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    avgX += centerX;
                    avgY += centerY;
                    count++;

                    const colorHex = board[r][c] ? board[r][c].hex : '#ffffff';
                    spawnParticles(centerX, centerY, colorHex, 10);

                    cellEl.classList.add('clearing');
                    board[r][c] = null;
                });

                avgX /= count;
                avgY /= count;

                // Cálculo de pontuação com multiplicador de linhas e combo
                const lineBonus = totalLines * 100 * totalLines;
                const comboBonus = comboStreak > 1 ? comboStreak * 50 : 0;
                const earnedPoints = lineBonus + comboBonus;
                addScore(earnedPoints);

                // Efeitos visuais de texto flutuante
                showFloatingText(`+${earnedPoints}`, avgX, avgY, 'text-emerald-300', 'text-2xl sm:text-3xl');

                if (totalLines >= 2 || comboStreak >= 2) {
                    let praise = '';
                    if (totalLines >= 4) praise = 'INCRÍVEL!! 🔥';
                    else if (totalLines === 3) praise = 'ESPETACULAR! ✨';
                    else if (totalLines === 2) praise = 'PERFEITO! ⚡';

                    if (comboStreak >= 2) {
                        setTimeout(() => {
                            showFloatingText(`COMBO x${comboStreak}!`, avgX, avgY - 38, 'text-amber-300', 'text-3xl sm:text-4xl');
                        }, 140);
                    } else if (praise) {
                        setTimeout(() => {
                            showFloatingText(praise, avgX, avgY - 38, 'text-pink-300', 'text-3xl sm:text-4xl');
                        }, 140);
                    }

                    // Tremor sutil na tela
                    boardWrapperEl.classList.remove('shake');
                    void boardWrapperEl.offsetWidth;
                    boardWrapperEl.classList.add('shake');
                }

                updateComboBadge();

                setTimeout(() => {
                    cellElements.flat().forEach(el => el.classList.remove('clearing'));
                    renderBoard();
                    postMoveCheck();
                }, 320);

            } else {
                // Quebra a sequência de combo se não limpou nenhuma linha
                comboStreak = 0;
                updateComboBadge();
                postMoveCheck();
            }
        }

        function postMoveCheck() {
            // Se todas as 3 peças foram usadas, gera um novo conjunto
            if (trayPieces.every(p => p === null)) {
                generateTrayPieces();
            } else {
                renderTray();
            }

            // Verifica Game Over
            if (checkGameOver()) {
                triggerGameOver();
            }
        }

        /**
         * ============================================================================
         * 8. VERIFICAÇÃO DE GAME OVER E CONTROLE DE PONTUAÇÃO
         * ============================================================================
         */
        function canPieceFitAnywhere(piece) {
            if (!piece) return false;
            for (let r = 0; r <= BOARD_SIZE - piece.rows; r++) {
                for (let c = 0; c <= BOARD_SIZE - piece.cols; c++) {
                    if (canPlacePiece(piece, r, c)) {
                        return true;
                    }
                }
            }
            return false;
        }

        function checkGameOver() {
            const remainingPieces = trayPieces.filter(p => p !== null);
            if (remainingPieces.length === 0) return false;

            // Se pelo menos uma peça restante couber em algum lugar, o jogo continua
            return !remainingPieces.some(piece => canPieceFitAnywhere(piece));
        }

        function triggerGameOver() {
            isGameOver = true;
            sound.playGameOver();

            const isNewRecord = score > 0 && score >= highScore;
            document.getElementById('final-score').textContent = score.toLocaleString('pt-BR');
            document.getElementById('final-best').textContent = highScore.toLocaleString('pt-BR');

            const recordBadge = document.getElementById('new-record-badge');
            if (isNewRecord) {
                recordBadge.classList.remove('hidden');
            } else {
                recordBadge.classList.add('hidden');
            }

            setTimeout(() => {
                gameOverModalEl.classList.remove('hidden');
                gameOverModalEl.classList.add('flex');
            }, 450);
        }

        function addScore(points) {
            score += points;
            scoreEl.textContent = score.toLocaleString('pt-BR');

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('blockBlastHighScore', highScore.toString());
                highScoreEl.textContent = highScore.toLocaleString('pt-BR');
            }
        }

        function updateComboBadge() {
            if (comboStreak >= 2) {
                comboBadgeEl.textContent = `COMBO x${comboStreak}`;
                comboBadgeEl.classList.remove('opacity-0', 'scale-90');
                comboBadgeEl.classList.add('opacity-100', 'scale-100');
            } else {
                comboBadgeEl.classList.add('opacity-0', 'scale-90');
                comboBadgeEl.classList.remove('opacity-100', 'scale-100');
            }
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            comboStreak = 0;
            scoreEl.textContent = '0';
            highScoreEl.textContent = highScore.toLocaleString('pt-BR');
            updateComboBadge();

            gameOverModalEl.classList.add('hidden');
            gameOverModalEl.classList.remove('flex');

            initBoard();
            generateTrayPieces();
        }

        /**
         * ============================================================================
         * 9. EVENTOS DE INTERFACE E INICIALIZAÇÃO
         * ============================================================================
         */
        document.getElementById('btn-sound').addEventListener('click', () => {
            const isMuted = sound.toggleMute();
            document.getElementById('icon-sound-on').classList.toggle('hidden', isMuted);
            document.getElementById('icon-sound-off').classList.toggle('hidden', !isMuted);
        });
        document.getElementById('btn-restart').addEventListener('click', () => {
            sound.playPickup();
            resetGame();
        });

        document.getElementById('btn-play-again').addEventListener('click', () => {
            sound.playPickup();
            resetGame();
        });

        window.addEventListener('resize', () => {
            if (!isGameOver) {
                renderTray();
            }
        });

        // Inicia o jogo ao carregar
        window.onload = () => {
            highScoreEl.textContent = highScore.toLocaleString('pt-BR');
            resetGame();
        };
    </script>
